# Creator list for the Python version. Copy to creators.toml (ignored by
# git) and edit. `handle` (the @name in a channel's address) is optional but
# surest; without it the name is searched, and a name that matches more than
# one sizeable channel is dropped. A name ending in "…" matches by prefix.

[[creator]]
name = "Veritasium"
handle = "@veritasium"

